name: orbit-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:9091:9091"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command:
      - -config.expand-env=true
      - -config.file=/etc/tempo/tempo.yml
    environment:
      TEMPO_METRICS_ENVIRONMENT: ${TEMPO_METRICS_ENVIRONMENT:?TEMPO_METRICS_ENVIRONMENT is required}
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:4318:4318"
    expose: ["3200"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on: [prometheus]
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:2.2.0
    command:
      - -config.file=/etc/pyroscope/pyroscope.yml
      - -compactor.blocks-retention-period=168h
      - -write-path=ingester
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:4040:4040"
    volumes:
      - ./pyroscope/pyroscope.yml:/etc/pyroscope/pyroscope.yml:ro
      - pyroscope-data:/var/lib/pyroscope
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo, pyroscope]
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  pyroscope-data:
  tempo-data:
