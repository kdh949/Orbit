stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 336h

metrics_generator:
  registry:
    external_labels:
      environment: ${TEMPO_METRICS_ENVIRONMENT}
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      span_multiplier_key: orbit.trace.sample_ratio
      database_name_attributes:
        - db.namespace
        - db.name
        - db.system
        - db.system.name
    span_metrics:
      span_multiplier_key: orbit.trace.sample_ratio
      enable_target_info: false
      enable_instance_label: false

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics-latency
        - span-metrics-count

usage_report:
  reporting_enabled: false
