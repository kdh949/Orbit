log_format orbit_observability escape=json
  '{"timestamp":"$time_iso8601",'
  '"service":"orbit-nginx",'
  '"event":"nginx_request",'
  '"requestId":"$request_id",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"requestTimeSeconds":$request_time,'
  '"upstreamHeaderTimeSeconds":"$upstream_header_time",'
  '"upstreamResponseTimeSeconds":"$upstream_response_time",'
  '"upstreamStatus":"$upstream_status",'
  '"requestBytes":$request_length,'
  '"responseBodyBytes":$body_bytes_sent,'
  '"responseBytes":$bytes_sent}';

access_log /var/log/nginx/orbit_access.log orbit_observability;

server {
  listen unix:/run/orbit-nginx/status.sock;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;
  }

  location / {
    return 404;
  }
}
