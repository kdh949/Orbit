[project]
name = "orbit-python-worker"
version = "0.1.0"
description = "ORBIT FastAPI worker for document, speech, and AI helper tasks"
requires-python = ">=3.12"
dependencies = [
  "av>=18,<19",
  "boto3>=1.39,<2",
  "fastapi>=0.115.0",
  "librosa>=0.11,<0.12",
  "numpy>=2,<3",
  "openai>=1.86.0",
  "Pillow>=10.0,<12.0",
  "pydantic>=2.11.0",
  "psycopg[binary]>=3.2.0",
  "prometheus-client>=0.22,<1",
  "PyMuPDF>=1.24,<2.0",
  "pytesseract>=0.3.10,<0.4",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20",
  "python-pptx>=0.6.23,<2.0",
  "silero-vad>=6.2,<6.3",
  "torch>=2,<3",
  "torchaudio>=2,<3",
  "uvicorn[standard]>=0.34.0",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-instrumentation-httpx>=0.59b0,<1",
  "opentelemetry-instrumentation-psycopg>=0.59b0,<1",
  "opentelemetry-instrumentation-botocore>=0.59b0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
