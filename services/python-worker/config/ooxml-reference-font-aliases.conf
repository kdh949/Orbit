<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Lora SemiBold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Lora</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>semibold</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Roboto SemiBold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Roboto</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>semibold</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Roboto Serif 14pt</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Roboto Serif</string>
    </edit>
    <edit name="fontvariations" mode="assign">
      <string>GRAD=0,opsz=14,wdth=100,wght=400</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Roboto Serif 14pt Medium</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Roboto Serif</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>medium</const>
    </edit>
    <edit name="fontvariations" mode="assign">
      <string>GRAD=0,opsz=14,wdth=100,wght=500</string>
    </edit>
  </match>
</fontconfig>
