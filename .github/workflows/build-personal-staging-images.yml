name: Build personal staging images

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-staging-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: kdh949

jobs:
  validate:
    name: Validate personal staging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate deployment contracts
        run: |
          bash -n infra/scripts/deploy-personal-server.sh
          bash -n infra/scripts/orbit-deploy-personal-staging-wrapper.sh
          node infra/scripts/check-env.mjs
          node --test \
            infra/scripts/personal-staging-env.test.mjs \
            infra/scripts/personal-staging-wrapper.test.mjs \
            infra/scripts/personal-staging-deploy.test.mjs

  build-backend:
    name: Build ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker
          - python-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=personal-staging-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=personal-staging-${{ matrix.service }}

  build-web:
    name: Build web
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_ENV=staging
            API_BASE_URL=http://api:3000
            WEB_PORT=5173
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/orbit-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=personal-staging-web
          cache-to: type=gha,mode=max,scope=personal-staging-web
